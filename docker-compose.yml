services:
  # Backend API + WhatsApp
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kevin-studio-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Kevin Hussein}
      - DATABASE_PATH=/app/data/database.sqlite
      - SCHEDULER_ENABLED=true
      - WHATSAPP_SESSION_PATH=/app/auth_info_baileys
      - WHATSAPP_AUTO_CONNECT=true
    volumes:
      - ./server/data:/app/data
      - ./server/auth_info_baileys:/app/auth_info_baileys
      - ./server/backups:/app/backups
    networks:
      - kevin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kevin-studio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:3001/api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - kevin-network

networks:
  kevin-network:
    driver: bridge

volumes:
  db-data:
  whatsapp-data:
